[pytest]
norecursedirs = data datasets .venv node_modules "wikipedia extracter" "gyroidic reasoner related media" test_raw_data test_storage test_repo recovered_files tmp scratch "google secret" .git __pycache__ .pytest_cache .qodo .zk_proofs
testpaths = tests
markers =
    slow: marks tests as slow (deselect with '-m \"not slow\"')
    integration: marks tests that require full backend integration

env =
    ARROW_USER_FS_THREADS=0
    ARROW_DISABLE_S3=1
